<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Nhi 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6e6; /* Nền hồng nhạt sạch sẽ */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            backdrop-filter: blur(8px);
            text-align: center;
            max-width: 90%;
            width: 420px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* Biểu tượng gấu/tim trang trí phía trên */
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .question {
            font-size: 24px;
            color: #ff4d6d;
            font-weight: 700;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        /* Khu vực chứa 2 nút */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            height: 60px;
            position: relative;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background-color 0.3s;
        }

        /* Nút Có */
        #btnYes {
            background-color: #ff4d6d;
            color: white;
        }

        #btnYes:hover {
            transform: scale(1.1);
            background-color: #ff758f;
        }

        /* Nút Không (Sẽ nhảy trốn) */
        #btnNo {
            background-color: #ffffff;
            color: #666;
            position: absolute; /* Quan trọng để di chuyển tự do */
            right: 40px; 
            transition: all 0.1s ease-out; /* Tạo hiệu ứng lướt đi mượt mà */
        }

        /* Hiệu ứng trái tim bay khi đồng ý */
        .heart-pop {
            position: absolute;
            font-size: 24px;
            animation: flyUp 3s forwards ease-out;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon" id="cardIcon">👉👈</div>
        <div class="question" id="textQuestion">Cậu có thích tớ không? 👀</div>
        
        <div class="btn-container">
            <button class="btn" id="btnYes" onclick="loveAccepted()">Có chứ! ❤️</button>
            <button class="btn" id="btnNo" onmouseover="runAway()" onclick="runAway()">Không nha 😜</button>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btnNo');
        const textQuestion = document.getElementById('textQuestion');
        const cardIcon = document.getElementById('cardIcon');
        const btnContainer = document.querySelector('.btn-container');

        // Hàm làm nút "Không" tự động nhảy trốn khi rê chuột hoặc chạm vào
        function runAway() {
            // Lấy kích thước màn hình
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Tính toán vị trí ngẫu nhiên nhưng giữ nút nằm trong màn hình nhìn thấy được
            const randomX = Math.max(20, Math.random() * (windowWidth - btnNo.offsetWidth - 40));
            const randomY = Math.max(20, Math.random() * (windowHeight - btnNo.offsetHeight - 40));

            // Đổi nút sang trạng thái cố định toàn màn hình để nhảy tự do
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Hàm xử lý khi bấm nút "Có chứ!"
        function loveAccepted() {
            // Thay đổi nội dung lời nhắn
            textQuestion.innerHTML = "Tớ biết ngay mà! 🥰<br>Nhắn tin cho tớ liền đi nhaaa!";
            cardIcon.innerHTML = "🎉🥳";
            
            // Ẩn 2 nút bấm đi
            btnContainer.style.display = 'none';

            // Tạo hiệu ứng bắn tim liên tục trong 3 giây
            const duration = 3000;
            const end = Date.now() + duration;

            const interval = setInterval(() => {
                if (Date.now() > end) {
                    return clearInterval(interval);
                }
                createHeartPop();
            }, 80);
        }

        // Hàm tạo các trái tim bay lên
        function createHeartPop() {
            const heart = document.createElement('div');
            heart.classList.add('heart-pop');
            
            // Danh sách các biểu tượng dễ thương
            const heartIcons = ['❤️', '💖', '💕', '🥰', '🌸', '✨'];
            heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            
            // Vị trí xuất hiện ngẫu nhiên theo chiều ngang màn hình
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '0px';
            
            // Tốc độ bay ngẫu nhiên
            heart.style.animationDuration = (Math.random() * 2 + 1) + 's';
            
            document.body.appendChild(heart);

            // Xóa phần tử sau khi bay xong
            setTimeout(() => {
                heart.remove();
            }, 3000);
        }
    </script>

</body>
</html>
