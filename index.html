<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Thương Nhi ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas nền -->
    <canvas id="sky"></canvas>

    <!-- Mặt trăng -->
    <div class="moon"></div>

    <!-- Container chính -->
    <div class="container">

        <!-- Trái tim -->
        <div class="heart"></div>

        <!-- Nội dung -->
        <div class="message">

            <h1 id="title">
                ❤️ Thương Nhi ❤️
            </h1>

            <p class="line">
                🌸 Mau ăn chóng lớn nhé
            </p>

            <p class="line">
                😴 Ngủ nhiều lên nhé
            </p>

            <p class="line small">
                "Giữa hàng ngàn kilomet,<br>
                .anh chỉ muốn rút ngắn khoảng cách bằng một cái ôm"
            </p>

        </div>

    </div>

    <!-- Lá anh đào -->
    <div id="petals"></div>

    <!-- Tim bay -->
    <div id="hearts"></div>

    <script src="script.js"></script>

</body>
</html>
