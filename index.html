<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Nhi 💕</title>
    <!-- Nhúng file CSS bên ngoài vào đây -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="icon" id="cardIcon">👉👈</div>
        <div class="question" id="textQuestion">Cậu có thích tớ không? 👀</div>
        
        <div class="btn-container">
            <button class="btn" id="btnYes" onclick="loveAccepted()">Có chứ! ❤️</button>
            <button class="btn" id="btnNo" onmouseover="runAway()" onclick="runAway()">Không nha 😜</button>
        </div>
    </div>

    <!-- Nhúng file JavaScript bên ngoài vào đây -->
    <script src="script.js"></script>
</body>
</html>
