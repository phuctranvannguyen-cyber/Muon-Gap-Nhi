<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background -->

    <div id="background"></div>

    <!-- IDE -->

    <div class="editor">

        <!-- Top Bar -->

        <div class="topbar">

            <div class="buttons">

                <span class="red"></span>
                <span class="yellow"></span>
                <span class="green"></span>

            </div>

            <div class="title">

                PHÚC NÈ SYSTEM

            </div>

        <!-- Workspace -->

        <div class="workspace">

            <!-- Explorer -->

            <aside class="sidebar">

                <div class="explorer-title">

                    EXPLORER

                </div>

                <div class="file active">

                    📄 main.cpp

                </div>

                <div class="file">

                    📄 engine.cpp

                </div>

                <div class="file">

                    📄 renderer.cpp

                </div>

                <div class="file">

                    📄 particle.cpp

                </div>

                </div>

            <main class="editor-area">

                <pre id="screen"></pre>

            </main>

        </div>

        <!-- Status -->

        <div class="statusbar">

            <span>C++</span>

            <span>UTF-8</span>

            <span>Ln 1</span>

            <span id="status">

                Ready

            </span>

        </div>

    <canvas id="canvas"></canvas>
